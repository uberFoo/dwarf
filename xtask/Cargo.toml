[package]
name = "xtask"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.65"

[dependencies]
anyhow = "1.0.95"
flate2 = "1.0.35"
write-json = "0.1.4"
xshell = "0.2.7"
xflags = "0.3.2"
time = { version = "0.3.37", default-features = false }
zip = { version = "2.2.2", default-features = false, features = [
    "deflate",
    "time",
] }
glob = "0.3.2"
# Avoid adding more dependencies to this crate
